description = "nhaystack runtime module"

moduleManifest {
    preferredSymbol = "nh"
    runtimeProfile = "rt"
    moduleName = "nhaystack"
}

dependencies {
    implementation fileTree(dir: 'lib', include: ['*.jar'])

    implementation "Tridium:nre:4.4.93.40"
    implementation "Tridium:alarm-rt:4.4.93.40"
    implementation "Tridium:baja:4.4.93.40"
    implementation "Tridium:bql-rt:4.4.93.40"
    implementation "Tridium:control-rt:4.4.93.40"
    implementation "Tridium:driver-rt:4.4.93.40"
    implementation "Tridium:fox-rt:4.4.93.40"
    implementation "Tridium:haystack-rt:4.4.94.40.3"
    implementation "Tridium:history-rt:4.4.93.40"
    implementation "Tridium:net-rt:4.4.93.40"
    implementation "Tridium:niagaraDriver-rt:4.4.93.40"
    implementation "Tridium:schedule-rt:4.4.93.40"
    implementation "Tridium:tagdictionary-rt:4.4.93.40"
    implementation "Tridium:web-rt:4.4.93.40"

    moduleTestImplementation "Tridium:test-se:4.4.93.40"
    moduleTestImplementation "Tridium:haystack-rt:4.4"
    moduleTestImplementation "Tridium:kitControl-rt:4.4.93.40.22"
    moduleTestImplementation "Tridium:jetty-rt:4.4.93.40"
    moduleTestImplementation "Tridium:bacnet-rt:4.4.93.40"

    testImplementation 'org.testng:testng:6.10'
    testImplementation "Tridium:alarm-rt:4.4.93.40"
    testImplementation fileTree(dir: 'lib', include: ['*.jar'])

    uberjar "javax.servlet:javax.servlet-api:3.0.1"

    testUberjar "com.e-movimento.tinytools:privilegedaccessor:1.2.2"
    testUberjar "org.mockito:mockito-inline:2.24.0"
}

test {
    useTestNG()

    include 'nhaystack/test/**'
    include 'nhaystack/server/**'

    testLogging.showStandardStreams = true
}

jar {
    from('src') {
        include 'nhaystack/res/*.csv'
        include 'nhaystack/res/*.txt'
        include 'nhaystack/res/equip-points/*.txt'
        include 'nhaystack/icons/*.*'
    }
    from(configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) })
            {
                include "org/projecthaystack/**"
            }
}

moduleTestJar {
    from('srcTest') {
        include 'stations/importTestStation.xml'
    }
}
